# Netlify configuration for the OptiFlow website.
# Next.js is detected automatically and served by Netlify's Next.js runtime
# (@netlify/plugin-nextjs). Do not pin or install that plugin by hand.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secret scanner can flag values that are public by design (they are
  # inlined into the browser bundle). These three are safe to ignore. Never add a
  # real secret (service-role key, Resend key) to this list.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL"

# Do not add a catch-all "/* /index.html 200" rule. It would break server-side pages and actions.
